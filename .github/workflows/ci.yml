name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard backstop for the whole job, independent of the backend e2e step's
    # own 5-minute timeout below - install/lint/unit/build/dashboard-e2e
    # together normally finish well inside this, so it only bites if
    # something is stuck. Raised from 12 at Stage H2 for the Playwright
    # smoke suite added below it (backend build, migrations, browser
    # install, and the suite itself) - see that stage's own comments for
    # what each added step costs.
    timeout-minutes: 20

    services:
      # Version matches docker-compose.yml, so CI exercises the same engine
      # version the app actually runs against everywhere else.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bongofleet
          POSTGRES_PASSWORD: bongofleet_ci_password
          POSTGRES_DB: bongofleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bongofleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Plain dev-shaped names, matching REDIS_URL/DATABASE_URL below - the
      # e2e suite (test/utils/test-database.ts, test/utils/test-redis.ts)
      # derives and refuses-if-colliding its own *_test database and its own
      # Redis db 15 from these at runtime (Stage H0c). Nothing here should
      # point at a test target directly; that guard is the point.
      DATABASE_URL: postgresql://bongofleet:bongofleet_ci_password@localhost:5432/bongofleet
      REDIS_URL: redis://localhost:6379
      # Not real secrets - this is an ephemeral CI database with no data
      # worth protecting. Long enough to satisfy JWT signing, nothing more.
      JWT_ACCESS_SECRET: ci-only-access-secret-32-characters-minimum-not-a-real-value
      JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum-not-a-real-value

    steps:
      - uses: actions/checkout@v4

      # First step, before any install/build, so a bad commit fails in
      # seconds and never wastes a build on content that must not have been
      # pushed at all. This repo is PUBLIC: once real personal data lands in
      # history, removing it means rewriting that history, not just adding a
      # follow-up commit - so this is worth failing a build over.
      #
      # The exclusion list below holds EXACTLY the sanctioned placeholder
      # values established in the H0b purge - the all-zero NIDA
      # (00000000-00000-00000-00), the +2557000000xx phone range, the
      # all-zero NMB account (0000000000), and the all-zero Lipa number
      # (000000) - and nothing else. Anything that doesn't match gets edited
      # to conform to one of these, not added as a new exception: every line
      # added here is a permanent hole in the one check that guards a public
      # repo from a history rewrite.
      - name: Personal-data sweep
        run: |
          set +e
          matches=$(grep -rnE "[0-9]{8}-[0-9]{5}-[0-9]{5}-[0-9]{2}|\+255[0-9]{9}|NMB [0-9]{6,}|Lipa [0-9]{6,}" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.pnpm-store \
            --exclude=pnpm-lock.yaml \
            . | grep -vE "00000000-00000-00000-00|\+25570000000[0-9]|NMB 0000000000|Lipa 000000")
          set -e
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Personal-data sweep found content shaped like a real NIDA number, phone number, or bank/mobile-money account outside the sanctioned placeholder set. This repo is PUBLIC - once real personal data is pushed, removing it requires rewriting git history, not a follow-up commit. Fix the line(s) above to use the existing sanctioned placeholders (00000000-00000-00000-00 / +2557000000xx / NMB 0000000000 / Lipa 000000) - do not add a new exception to this step's exclusion pattern, and do not delete this step, to get past it."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the major version pnpm-lock.yaml's lockfileVersion 9.0
          # was written by, not "latest" - a lockfile-format bump under us
          # would break --frozen-lockfile installs without warning.
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Matches packages/backend/Dockerfile's `FROM node:22-alpine` - the
          # actual version this app runs on in the deployed image, not just
          # the >=20.0.0 floor in the root package.json's "engines" field.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unlike shared-lib's dist/, nothing in package.json (no pretest,
      # no postinstall) regenerates @prisma/client automatically - only
      # packages/backend/Dockerfile did this before now, as its own explicit
      # RUN step. A clean pnpm install leaves @prisma/client exporting
      # nothing (no Prisma, no UserRole, no enums at all), which every
      # backend module imports - lint and both test suites need this to
      # exist before they can even parse. This only reads prisma/schema.prisma
      # to emit client code; it never connects to a database.
      - name: Generate Prisma client
        run: pnpm --filter @bongofleet/backend run db:generate

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm --filter @bongofleet/backend test

      # No explicit shared-lib build step anywhere in this workflow, on
      # purpose: pnpm/package.json's own pretest, pretest:e2e, and (for the
      # dashboard build below) prebuild hooks are what are supposed to keep
      # shared-lib/dist/ fresh (see Stage F3a). A clean CI checkout starts
      # with no dist/ at all, so this is the one environment where, if those
      # hooks are broken, nothing else papers over it - the build fails
      # loudly instead of quietly shipping a stale shared-lib.
      - name: E2E tests
        run: pnpm --filter @bongofleet/backend test:e2e
        # Root cause found and fixed: test/utils/prisma-test.util.ts's
        # cleanDatabase() held a module-level ioredis singleton across every
        # call, in every e2e spec file, and nothing ever quit it - a real
        # unbounded leak (not a teardown delay), present since Stage H0,
        # unchanged by H0c's rename of the same connection. Confirmed by
        # exit, not by timeout: the fixed suite (all 19 suites / 91 tests)
        # now exits on its own with no lingering handle. This timeout is
        # back to a tight backstop against a genuine future hang, not
        # padding for this one - do not widen it to make a future failure
        # here go away without the same by-exit proof this one got. Not
        # --forceExit, same reasoning as always: hiding a real leak here
        # would hide the same leak in the running application.
        timeout-minutes: 5

      - name: Build dashboard
        run: pnpm --filter @bongofleet/dashboard build

      # Stage H2 - three bugs (the create-plan toggle freeze, a dev-only
      # infinite loop, and the End/Days left columns reading blank) each
      # shipped on this same green build because nothing above ever opened
      # the actual bundled app in a real browser: lint, unit tests, and the
      # backend's own e2e suite all read source or an in-process server, and
      # "Build dashboard" above only proves the bundle compiles, not that it
      # runs. Everything from here down does that - against `vite preview`,
      # the same production build a person would click through, driven by a
      # backend built and started the same way (`start:prod`, not
      # `start:dev`), never the dev server.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, not package.json, so this tracks the
          # exact pinned @playwright/test version (1.61.1) the browser
          # binaries must match - a range would let package.json and the
          # cached browser drift apart silently.
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # Only chromium is configured (playwright.config.ts's `projects`) -
        # installing the other two engines here would be a pure CI-time cost
        # for browsers nothing in this suite launches. --with-deps still runs
        # every time (cheap when the apt packages are already present) since
        # the cache above only covers the browser binary, not OS libraries.
        run: pnpm --filter @bongofleet/dashboard exec playwright install --with-deps chromium

      - name: Build backend
        run: pnpm --filter @bongofleet/backend build

      - name: Apply database migrations
        run: pnpm --filter @bongofleet/backend run db:migrate:deploy

      - name: Start backend (production build)
        # start:prod runs `node dist/main`, the same entrypoint the deployed
        # container uses - not start:dev, which the dashboard's own dev
        # server bypassed the same way when Stage G9's freeze went unnoticed.
        # CORS_ORIGINS is intentionally left unset: NODE_ENV=test (job env,
        # above) means main.ts's own DEV_DEFAULT_CORS_ORIGINS applies, which
        # is the real thing under test here, not a CI-only workaround layered
        # on top of it.
        run: |
          pnpm --filter @bongofleet/backend run start:prod &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 30s"
          exit 1

      - name: Seed demo data
        run: pnpm --filter @bongofleet/backend run seed

      - name: Dashboard Playwright smoke suite
        run: pnpm --filter @bongofleet/dashboard test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/dashboard/test-results/
          retention-days: 7
